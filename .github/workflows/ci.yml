name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # Pinned to the Xcode generation the project is maintained with
    # (LastUpgradeCheck 1610). Bump deliberately, not implicitly.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Build iOS app
        run: >
          xcodebuild build -scheme WaterTracker
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""

      - name: Build watchOS app
        run: >
          xcodebuild build -scheme "WaterTracker Watch App"
          -destination 'generic/platform=watchOS'
          CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""

      - name: Run unit tests
        run: >
          xcodebuild test -scheme WaterTracker
          -destination 'platform=iOS Simulator,name=iPhone 16'
          -only-testing:WaterTrackerTests
          CODE_SIGNING_ALLOWED=NO
